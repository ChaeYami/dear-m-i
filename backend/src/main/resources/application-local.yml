# ============================================================
# Local 개발 환경 설정
# 민감한 값은 모두 .env 파일에서 환경변수로 주입 (Git 커밋 금지)
# .env 파일이 없다면: cp .env.example .env 후 값 채우기
# ============================================================
spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
          apple:
            client-id: ${APPLE_CLIENT_ID}
            client-secret: ${APPLE_CLIENT_SECRET}

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      connection-timeout: 30000

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    url: ${DB_URL}
    user: ${DB_USERNAME}
    password: ${DB_PASSWORD}

# 로컬 환경 상세 로깅
logging:
  level:
    com.dearmi: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

# AWS (로컬 테스트용 — S3 호출 시 실제 키 필요)
aws:
  s3:
    bucket: ${AWS_S3_BUCKET}
    region: ${AWS_REGION:ap-northeast-2}
  credentials:
    access-key: ${AWS_ACCESS_KEY}
    secret-key: ${AWS_SECRET_KEY}

# 약학정보원 API
drug-info:
  api-key: ${DRUG_INFO_API_KEY}
  api-url: https://apis.data.go.kr/1471000/DrbEasyDrugInfoService

# Claude API
claude:
  api-key: ${CLAUDE_API_KEY}
  api-url: https://api.anthropic.com/v1/messages

# 암호화 키
encryption:
  key: ${ENCRYPTION_KEY}

# JWT
jwt:
  secret: ${JWT_SECRET}
  access-token-expiry-ms: 3600000    # 1시간
  refresh-token-expiry-ms: 604800000 # 7일
