# ============================================================
# Local 개발 환경 설정
# ⚠️ 이 파일은 Git에 커밋되어도 되지만 실제 운영 정보는 절대 포함 금지
# ============================================================
spring:
  # OAuth2 로컬 플레이스홀더 — Google Cloud Console에서 발급 후 교체
  # Google: https://console.cloud.google.com/apis/credentials
  # Apple: https://developer.apple.com/account/resources/identifiers
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: REPLACE_ME_GOOGLE_CLIENT_ID
            client-secret: REPLACE_ME_GOOGLE_CLIENT_SECRET
          apple:
            client-id: REPLACE_ME_APPLE_BUNDLE_ID
            # Apple client-secret은 단순 문자열이 아닌 JWT (ES256 서명)
            # 참고: https://developer.apple.com/documentation/accountorganizationaldatasharing/creating-a-client-secret
            client-secret: REPLACE_ME_APPLE_CLIENT_SECRET_JWT
  datasource:
    url: jdbc:postgresql://localhost:5432/dearmidb
    username: postgres
    password: local1234
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      connection-timeout: 30000

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Flyway 로컬 설정
  flyway:
    url: jdbc:postgresql://localhost:5432/dearmidb
    user: postgres
    password: local1234

# 로컬 환경 상세 로깅
logging:
  level:
    com.dearmi: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

# 암호화 키 (로컬 테스트용 - 운영에서는 AWS Secrets Manager로 주입)
encryption:
  key: local-dev-encryption-key-for-testing-only

# JWT 설정 (로컬 테스트용 - 운영에서는 환경변수로 주입)
jwt:
  secret: local-dev-secret-key-must-be-at-least-256-bits-long-for-hs256
  access-token-expiry-ms: 3600000    # 1시간
  refresh-token-expiry-ms: 604800000 # 7일
