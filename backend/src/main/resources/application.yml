# ============================================================
# 공통 설정 (모든 프로파일에 적용)
# 프로파일별 설정은 application-{profile}.yml 에서 오버라이드
# ============================================================
spring:
  application:
    name: dear-mi-backend

  # 활성 프로파일 — default 는 prod (안전 기본값).
  # 로컬 개발 시 SPRING_PROFILES_ACTIVE=local 로 명시 (gradle bootRun 이 자동 주입).
  # 운영 누락/오설정 시에도 DevAuthController 같은 local 전용 빈이 등록되지 않도록 보장.
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}

  # OAuth2 소셜 로그인 설정 (프로파일별 client-id/secret 오버라이드)
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid,email,profile
          apple:
            client-id: ${APPLE_CLIENT_ID}
            client-secret: ${APPLE_CLIENT_SECRET}
            scope: openid,email,name
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-authentication-method: client_secret_post
        provider:
          apple:
            # issuer-uri 대신 직접 지정 → 앱 시작 시 OIDC discovery 요청 방지
            authorization-uri: https://appleid.apple.com/auth/authorize
            token-uri: https://appleid.apple.com/auth/token
            jwk-set-uri: https://appleid.apple.com/auth/keys
            user-name-attribute: sub

  # JPA 공통 설정
  jpa:
    # ⚠️ DDL 자동 생성 절대 금지 - Flyway로 스키마 관리
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
    # SQL 로깅은 프로파일별로 조정
    show-sql: false

  # Flyway 공통 설정
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# Actuator 엔드포인트 설정
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: when-authorized

# AWS 설정
aws:
  s3:
    bucket: ${AWS_S3_BUCKET}
    region: ${AWS_REGION:ap-northeast-2}
  credentials:
    access-key: ${AWS_ACCESS_KEY}
    secret-key: ${AWS_SECRET_KEY}

# 약학정보원 e약은요 API
drug-info:
  api-key: ${DRUG_INFO_API_KEY}
  api-url: https://apis.data.go.kr/1471000/DrbEasyDrugInfoService

# Gemini API 설정 (처방전 OCR)
# primary 503 시 fallback → lite-fallback 순으로 자동 전환
# lite 는 별도 인프라라 flash/pro 동시 과부하 상황에서도 살아있을 수 있음
gemini:
  api-key: ${GEMINI_API_KEY}
  api-url: https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent
  fallback-url: https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-pro:generateContent
  lite-fallback-url: https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent

# 암호화 설정 (상담 기록 content AES-256-GCM)
encryption:
  key: ${ENCRYPTION_KEY}

# IAP 영수증 서버 검증 설정
iap:
  play:
    # Google Cloud 서비스 계정 JSON (AndroidPublisher API 권한 + Play Console 연동 필요)
    service-account-json: ${PLAY_DEVELOPER_API_JSON:}
    # 앱 패키지명 — subscriptionsv2.get 호출 시 사용
    package-name: ${PLAY_PACKAGE_NAME:com.chloee0033.dearmiapp}
  apple:
    # App Store Connect 의 bundle ID
    bundle-id: ${APPLE_BUNDLE_ID:com.chloee0033.dearmiapp}
    # App Store Connect > App 정보 > Apple ID (숫자)
    app-apple-id: ${APPLE_APP_APPLE_ID:0}
    # SANDBOX / PRODUCTION — 개발 중엔 SANDBOX, 출시 후 PRODUCTION
    environment: ${APPLE_ENV:SANDBOX}
    # Apple Root CA 인증서 경로. classpath:apple-root-ca-g3.cer 가 기본 (resources/ 에 번들)
    root-cert-path: ${APPLE_ROOT_CERT_PATH:classpath:apple-root-ca-g3.cer}

# 로깅 기본 설정
logging:
  level:
    com.dearmi: INFO
