# ============================================================
# 공통 설정 (모든 프로파일에 적용)
# 프로파일별 설정은 application-{profile}.yml 에서 오버라이드
# ============================================================
spring:
  application:
    name: dear-mi-backend

  # 활성 프로파일 (환경변수로 재정의 가능: SPRING_PROFILES_ACTIVE=prod)
  profiles:
    active: local

  # OAuth2 소셜 로그인 설정 (프로파일별 client-id/secret 오버라이드)
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid,email,profile
          apple:
            client-id: ${APPLE_CLIENT_ID}
            client-secret: ${APPLE_CLIENT_SECRET}
            scope: openid,email,name
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-authentication-method: client_secret_post
        provider:
          apple:
            # issuer-uri 대신 직접 지정 → 앱 시작 시 OIDC discovery 요청 방지
            authorization-uri: https://appleid.apple.com/auth/authorize
            token-uri: https://appleid.apple.com/auth/token
            jwk-set-uri: https://appleid.apple.com/auth/keys
            user-name-attribute: sub

  # JPA 공통 설정
  jpa:
    # ⚠️ DDL 자동 생성 절대 금지 - Flyway로 스키마 관리
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
    # SQL 로깅은 프로파일별로 조정
    show-sql: false

  # Flyway 공통 설정
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# Actuator 엔드포인트 설정
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: when-authorized

# AWS 설정
aws:
  s3:
    bucket: ${AWS_S3_BUCKET}
    region: ${AWS_REGION:ap-northeast-2}
  credentials:
    access-key: ${AWS_ACCESS_KEY}
    secret-key: ${AWS_SECRET_KEY}

# 약학정보원 e약은요 API
drug-info:
  api-key: ${DRUG_INFO_API_KEY}
  api-url: https://apis.data.go.kr/1471000/DrbEasyDrugInfoService

# Gemini API 설정 (처방전 OCR)
gemini:
  api-key: ${GEMINI_API_KEY}
  api-url: https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent

# 암호화 설정 (상담 기록 content AES-256-GCM)
encryption:
  key: ${ENCRYPTION_KEY}

# FCM 설정 (서비스 계정 JSON 문자열)
fcm:
  service-account-key: ${FCM_SERVICE_ACCOUNT_KEY}

# 로깅 기본 설정
logging:
  level:
    com.dearmi: INFO
