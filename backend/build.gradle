plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.dearmi'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

dependencies {
    // Spring Boot 기본 스타터
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // DB
    runtimeOnly 'org.postgresql:postgresql'

    // Flyway (DB 마이그레이션)
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // QueryDSL 5.x (Jakarta 버전)
    implementation 'com.querydsl:querydsl-jpa:5.1.0:jakarta'
    annotationProcessor 'com.querydsl:querydsl-apt:5.1.0:jakarta'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

    // MapStruct (DTO <-> Entity 매핑)
    implementation 'org.mapstruct:mapstruct:1.5.5.Final'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'

    // Lombok (MapStruct와 순서 중요: lombok 먼저)
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

    // JWT (jjwt 0.12.x)
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // AWS SDK v2
    implementation platform('software.amazon.awssdk:bom:2.25.60')
    implementation 'software.amazon.awssdk:s3'
    implementation 'software.amazon.awssdk:secretsmanager'

    // AOP (AuditLogAspect, @Async proxy)
    implementation 'org.springframework.boot:spring-boot-starter-aop'

    // WebClient (약학정보원 API 연동)
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    // Firebase Admin SDK (FCM 푸시 알림)
    implementation 'com.google.firebase:firebase-admin:9.3.0'

    // Bucket4j (Rate Limiting)
    implementation 'com.bucket4j:bucket4j-core:8.10.1'

    // OpenAPI (Swagger UI)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'

    // ShedLock (multi-instance 분산 스케줄러 락 — ECS 다중 태스크 환경에서 @Scheduled 중복 실행 방지)
    implementation 'net.javacrumbs.shedlock:shedlock-spring:5.16.0'
    implementation 'net.javacrumbs.shedlock:shedlock-provider-jdbc-template:5.16.0'

    // 테스트
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// QueryDSL Q클래스 생성 경로 설정
def queryDslDir = layout.buildDirectory.dir("generated/querydsl")

sourceSets {
    main {
        java {
            srcDirs += [queryDslDir]
        }
    }
}

tasks.withType(JavaCompile) {
    options.annotationProcessorGeneratedSourcesDirectory = queryDslDir.get().asFile
}

// clean 시 Q클래스도 삭제
clean {
    delete queryDslDir
}

tasks.named('test') {
    useJUnitPlatform()

    // .env 파일을 읽어 테스트 환경변수로 주입
    doFirst {
        def envFile = file('.env')
        if (envFile.exists()) {
            envFile.readLines().each { line ->
                def trimmed = line.trim()
                if (trimmed && !trimmed.startsWith('#')) {
                    def idx = trimmed.indexOf('=')
                    if (idx > 0) {
                        def key = trimmed.substring(0, idx).trim()
                        def value = trimmed.substring(idx + 1).trim()
                        environment(key, value)
                    }
                }
            }
        }
    }
}

// .env 파일을 읽어 bootRun 환경변수로 주입
bootRun {
    doFirst {
        def envFile = file('.env')
        if (envFile.exists()) {
            envFile.readLines().each { line ->
                def trimmed = line.trim()
                if (trimmed && !trimmed.startsWith('#')) {
                    def idx = trimmed.indexOf('=')
                    if (idx > 0) {
                        def key = trimmed.substring(0, idx).trim()
                        def value = trimmed.substring(idx + 1).trim()
                        environment(key, value)
                    }
                }
            }
        }
    }
}

// .env 파일 자동 로드 (로컬 개발용)
def loadDotEnv = { task ->
    def envFile = file('.env')
    if (envFile.exists()) {
        envFile.readLines().each { line ->
            line = line.trim()
            if (line && !line.startsWith('#')) {
                def idx = line.indexOf('=')
                if (idx > 0) {
                    def key = line.substring(0, idx).trim()
                    def value = line.substring(idx + 1).trim()
                    task.environment(key, value)
                }
            }
        }
    }
}

bootRun {
    loadDotEnv(it)
}
