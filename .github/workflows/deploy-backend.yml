name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image to ECR
        working-directory: backend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/dearmi-backend:$IMAGE_TAG .
          docker build -t $ECR_REGISTRY/dearmi-backend:latest .
          docker push $ECR_REGISTRY/dearmi-backend:$IMAGE_TAG
          docker push $ECR_REGISTRY/dearmi-backend:latest

      - name: Force new ECS deployment
        run: |
          aws ecs update-service \
            --cluster dearmi-cluster \
            --service dearmi-backend-service \
            --force-new-deployment \
            --region ap-northeast-2
