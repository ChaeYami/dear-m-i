name: Deploy App (EAS — auto build both, submit iOS only)

# 📝 빌드는 iOS + Android 둘 다 진행 (Android AAB 는 EAS 대시보드에 남아서 수동 업로드 가능).
#    Submit (스토어 자동 업로드) 은 iOS 만. Android 자동 submission 은 한국 사업자 등록 +
#    통신판매업 신고번호 Play Console 입력 완료 후 추가 예정.

on:
  push:
    branches: [main]
    paths:
      - 'dearmi-app/**'
      - '.github/workflows/build-app.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Action mode'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto    # fingerprint 비교해서 자동 분기
          - build   # 강제 풀 빌드 + 제출
          - update  # 강제 OTA 만

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: dearmi-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Compute current fingerprint
        id: fp
        run: |
          OUTPUT=$(npx --yes @expo/fingerprint@latest .)
          HASH=$(echo "$OUTPUT" | jq -r .hash)
          echo "current=$HASH" >> $GITHUB_OUTPUT
          echo "Current fingerprint: $HASH"

      - name: Find latest production build runtimeVersion
        id: last
        run: |
          JSON=$(eas build:list --platform ios --status finished --channel production --limit 1 --json --non-interactive 2>/dev/null || echo "[]")
          LAST=$(echo "$JSON" | jq -r '.[0].runtimeVersion // ""')
          echo "last=$LAST" >> $GITHUB_OUTPUT
          echo "Last production runtimeVersion: $LAST"

      - name: Decide action
        id: decide
        run: |
          MODE="${{ github.event.inputs.mode }}"
          CUR="${{ steps.fp.outputs.current }}"
          LAST="${{ steps.last.outputs.last }}"
          if [ -z "$MODE" ] || [ "$MODE" = "auto" ]; then
            if [ -n "$CUR" ] && [ -n "$LAST" ] && [ "$CUR" = "$LAST" ]; then
              ACTION="update"
            else
              ACTION="build"
            fi
          else
            ACTION="$MODE"
          fi
          echo "action=$ACTION" >> $GITHUB_OUTPUT
          echo "Decided: action=$ACTION (mode=$MODE current=$CUR last=$LAST)"

      - name: OTA Update (both platforms)
        if: steps.decide.outputs.action == 'update'
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          MSG="${COMMIT_MSG:-Manual OTA update}"
          eas update --branch production --message "$MSG" --non-interactive

      - name: Build with EAS (iOS + Android)
        if: steps.decide.outputs.action == 'build'
        run: |
          eas build --platform all --profile production --non-interactive

      - name: Submit iOS to App Store Connect
        # Android 자동 submission 은 한국 사업자 등록 완료 후 추가 예정 (TODO)
        if: steps.decide.outputs.action == 'build'
        run: |
          eas submit --platform ios --profile production --latest --non-interactive
