name: Build & Submit App (EAS)

on:
  push:
    branches: [main]
    paths:
      - 'dearmi-app/**'
      - '.github/workflows/build-app.yml'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - ios
          - android
      submit:
        description: 'Auto-submit to stores (TestFlight / Play Internal)'
        required: true
        default: true
        type: boolean

jobs:
  build-and-submit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: dearmi-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build with EAS (wait for completion)
        run: |
          eas build \
            --platform ${{ github.event.inputs.platform || 'all' }} \
            --profile production \
            --non-interactive

      - name: Submit to stores
        if: ${{ github.event_name == 'push' || github.event.inputs.submit == 'true' }}
        run: |
          eas submit \
            --platform ${{ github.event.inputs.platform || 'all' }} \
            --profile production \
            --latest \
            --non-interactive
